<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>النوتة الروحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f4d3a;--g2:#2f6b52;--gold:#c8a24a;--bg:#faf6ec;--card:#fff;--ink:#23302a;--mut:#7a857e;--line:#e6dfcc;--err:#b3382c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px 12px 48px}
.top{background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.t1{font-weight:700;font-size:18px}.t2{font-size:13px;opacity:.85}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:6px 14px}
.tabs{display:flex;gap:6px;max-width:720px;margin:10px auto 0;padding:0 12px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-weight:600}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth .card{width:100%;max-width:400px;text-align:center;padding:24px}
.auth h1{margin:6px 0 2px;color:var(--g);font-size:24px}
.verse{color:var(--mut);font-size:14px;margin:0 0 14px}
.seg{display:flex;gap:4px;background:#f3eddb;border-radius:12px;padding:4px;margin:0 0 8px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 2px;font-weight:600;font-size:14px}
.seg button.on{background:var(--g);color:#fff}
label{display:block;text-align:right;font-weight:600;font-size:14px;margin:10px 0}
label input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdf7}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;margin-top:6px}
.primary{background:var(--g);color:#fff}.primary:disabled{opacity:.6}
.danger{background:#fbeae8;color:var(--err);margin-top:14px}
.link{background:none;border:0;color:var(--g2);margin-top:12px;text-decoration:underline}
.err{background:#fbeae8;color:var(--err);border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.weekbar>div{text-align:center;flex:1}.weekbar small{display:block;color:var(--gold);font-weight:700}
.weekbar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px}
.weekbar button:disabled{opacity:.35}
.prog{display:flex;align-items:center;gap:12px}
.pct{font-size:28px;font-weight:700;color:var(--g);min-width:70px}
.bar{flex:1;height:12px;border-radius:8px;background:#efe9d6;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g2));border-radius:8px}
.sub{color:var(--mut);font-size:13px}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
thead th{background:#f3eddb;font-size:13px}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
tbody th{text-align:right;padding-right:12px;white-space:nowrap}
.chk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:2px solid var(--gold);background:#fff;padding:0;color:#fff;font-weight:700;font-style:normal}
.chk.on{background:var(--g);border-color:var(--g)}
.chk.on::after{content:'✓'}
button:disabled.chk,button:disabled.wcard{opacity:1;cursor:default}
h3{margin:18px 4px 6px;color:var(--g)}
.wk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:right;font-weight:600;font-size:14px}
.wcard.on{border-color:var(--g);background:#eef6f1}
.wcard input{width:64px;padding:6px;border:1px solid var(--line);border-radius:10px;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;width:100%;text-align:right}
.row .nm{flex:0 0 38%;font-weight:600}
.row .bar{height:10px}.row .p{min-width:44px;text-align:left;font-weight:700;color:var(--g)}
.chip{font-size:11px;background:#f3eddb;border-radius:8px;padding:1px 7px;color:#7b6420;margin-right:6px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--g)}.stat span{font-size:12px;color:var(--mut)}
.back{background:none;border:0;color:var(--g2);font-weight:700;padding:8px 0}
.edit{display:flex;gap:8px;align-items:center;margin:6px 0}
.edit input,.edit select{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;min-width:0}
.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
.mini.red{color:var(--err)}
.mini:disabled{opacity:.4}
.invite{text-align:center;background:#eef6f1;border-color:#cfe3d6}
.invite .code{font-size:30px;font-weight:700;letter-spacing:4px;color:var(--g);direction:ltr;margin:2px 0}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.muted{color:var(--mut);text-align:center;padding:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23302a;color:#fff;padding:10px 18px;border-radius:12px;z-index:9;font-size:14px;max-width:90%}
@media(max-width:380px){th,td{font-size:12px}.chk{width:30px;height:30px}.wk{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== Firebase config =====
const firebaseConfig = {
  apiKey: "AIzaSyBQvGb6_UXuFxUCpk_Xn7G2kVvjrU9Kt5c",
  authDomain: "spiritual-notebook-404f8.firebaseapp.com",
  projectId: "spiritual-notebook-404f8",
  storageBucket: "spiritual-notebook-404f8.firebasestorage.app",
  messagingSenderId: "739384661995",
  appId: "1:739384661995:web:e6303ee0c545ac9d37abae"
};
// ===========================

const fbLoaded = typeof firebase !== 'undefined';
const configured = fbLoaded && !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DEFAULT_ITEMS = {
  daily: [
    {id:'bible', label:'الكتاب المقدس'},
    {id:'sleep', label:'صلاة النوم'},
    {id:'early', label:'صلاة باكر'},
    {id:'fast',  label:'صوم'}
  ],
  weekly: [
    {id:'mass', label:'قداس', type:'check'},
    {id:'communion', label:'تناول', type:'check'},
    {id:'serviceAttend', label:'حضور الخدمة', type:'check'},
    {id:'books', label:'كتب روحية', type:'check'},
    {id:'confession', label:'اعتراف', type:'check'},
    {id:'prayerMeet', label:'اجتماع الصلاة', type:'check'},
    {id:'familyMeet', label:'اجتماع الأسرة', type:'check'},
    {id:'lost', label:'عدد المفقودين', type:'number'},
    {id:'meditations', label:'تأملات', type:'check'},
    {id:'visitation', label:'الافتقاد', type:'check'},
    {id:'generalMeeting', label:'اجتماع الخدمة العام', type:'check'},
    {id:'selfExam', label:'محاسبة النفس', type:'check'}
  ]
};

const ERR = {
  'auth/email-already-in-use':'الاسم ده مسجل في المجموعة دي. لو ده انت اعمل تسجيل دخول، ولو شخص تاني أضف حاجة تميّز اسمك.',
  'auth/invalid-credential':'الكود أو الاسم أو كلمة السر غلط',
  'auth/wrong-password':'الكود أو الاسم أو كلمة السر غلط',
  'auth/user-not-found':'الكود أو الاسم أو كلمة السر غلط',
  'auth/weak-password':'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل',
  'auth/network-request-failed':'مفيش اتصال بالإنترنت',
  'auth/too-many-requests':'محاولات كتير، استنى شوية وجرّب تاني',
  'auth/operation-not-allowed':'فعّل Email/Password من Authentication في Firebase',
  'permission-denied':'مفيش صلاحية. اتأكد إن قواعد Firestore اتنشرت صح.'
};
const errText = e => ERR[e.code] || e.message || String(e);

// ---------- community code ----------
const CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
function genCode(n=6){
  const a=new Uint32Array(n);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*4294967296);
  let c=''; for(let i=0;i<n;i++) c+=CHARS[a[i]%CHARS.length];
  return c;
}
const normCode = c => String(c||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');

const S = {ready:false, mode:'login', busy:false, authErr:'', nmVal:'', codeVal:'', cnVal:'', registering:false, orphan:false,
  user:null, cid:null, cname:'', profile:null, items:clone(DEFAULT_ITEMS), draft:null, tab:'mine',
  weekStart:startOfWeek(new Date()), week:null, unsub:null, unsubP:null, unsubU:null,
  members:[], membersLoading:false, loadTok:0, selected:null};

// invite link (?c=CODE) opens the join form with the code filled in; otherwise remember the last code used on this device
try{
  const c=new URLSearchParams(location.search).get('c');
  if(c){ S.codeVal=normCode(c); S.mode='join' }
  else { const l=LS.get('nb_code'); if(l) S.codeVal=l }
}catch(e){}

// ---------- helpers ----------
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function wid(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fmt = d => d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
const isAdmin = () => !!(S.profile && S.profile.role === 'admin');
const isPending = () => !!(S.profile && S.profile.status === 'pending');
const ts = () => firebase.firestore.FieldValue.serverTimestamp();

function norm(n){return n.normalize('NFKC').replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase()}
function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0)}
// the account id is built from community code + name, so the same name can exist in different communities
const emailFor = (cid,n) => 'n'+h53(cid+'|'+norm(n)).toString(16)+'@notebook.app';

function calc(week){
  const dI=S.items.daily, wI=S.items.weekly.filter(i=>i.type!=='number');
  const d=(week&&week.d)||{}, w=(week&&week.w)||{};
  let done=0;
  for(let i=0;i<7;i++) for(const it of dI) if(d[i]&&d[i][it.id]) done++;
  for(const it of wI) if(w[it.id]) done++;
  const total=dI.length*7+wI.length;
  return {done,total,pct:total?Math.round(done*100/total):0};
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

// ---------- firebase ----------
let auth, db;
if(configured){ firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore(); }
// everything lives under the community: communities/{code}/...
const base = () => 'communities/'+S.cid;
const mRef = uid => db.doc(base()+'/members/'+(uid||S.user.uid));
const weekRef = (uid=S.user.uid, w=S.weekStart) => db.doc(base()+'/members/'+uid+'/weeks/'+wid(w));
const itemsRef = () => db.doc(base()+'/settings/items');

function cleanup(){
  for(const k of ['unsub','unsubP','unsubU']){ if(S[k]){S[k]();S[k]=null} }
  Object.assign(S,{orphan:false,cid:null,cname:'',week:null,members:[],selected:null,tab:'mine',draft:null,items:clone(DEFAULT_ITEMS),weekStart:startOfWeek(new Date())});
}

async function afterLogin(u){
  const dn=String(u.displayName||''), i=dn.indexOf('|');
  if(i<1) throw {message:'الحساب ده مش مرتبط بمجموعة. اعمل حساب جديد.'};
  S.user=u; S.cid=dn.slice(0,i);
  const [snap,cs]=await Promise.all([mRef().get(), db.doc('communities/'+S.cid).get().catch(()=>null)]);
  S.cname=(cs&&cs.exists)?(cs.data().name||''):'';
  S.orphan=!snap.exists;
  S.profile=snap.exists?snap.data():null;
  watchProfile();
  await enter();
}

// Live view of my own membership: approval, promotion and removal show up without re-login
function watchProfile(){
  if(S.unsubP){S.unsubP();S.unsubP=null}
  S.unsubP=mRef().onSnapshot(s=>{
    const p=s.exists?s.data():null, prev=S.profile;
    const changed=(!!p!==!!prev)||(p&&prev&&(p.role!==prev.role||p.status!==prev.status));
    S.profile=p; S.orphan=!p;
    if(changed) enter();
  }, ()=>{});
}

async function enter(){
  for(const k of ['unsub','unsubU']){ if(S[k]){S[k]();S[k]=null} }
  Object.assign(S,{week:null,members:[],selected:null,draft:null});
  if(!S.profile||isPending()){ S.authErr=''; render(); return }
  try{
    const it=await itemsRef().get();
    if(it.exists && Array.isArray(it.data().daily) && Array.isArray(it.data().weekly)) S.items={daily:it.data().daily,weekly:it.data().weekly};
  }catch(e){}
  S.tab=isAdmin()?'dash':'mine';
  S.weekStart=startOfWeek(new Date());
  if(isAdmin()){ watchUsers(); await loadMembers(); }
  else { watchWeek(); render(); }
}

// Leader gets new join requests live while looking at the list
function watchUsers(){
  if(S.unsubU){S.unsubU();S.unsubU=null}
  let first=true;
  S.unsubU=db.collection(base()+'/members').onSnapshot(()=>{
    if(first){first=false;return}
    if(isAdmin()&&S.tab==='dash'&&!S.selected) loadMembers(true);
  }, ()=>{});
}

function watchWeek(){
  if(S.unsub){S.unsub();S.unsub=null}
  S.week=null;
  if(!S.user) return;
  S.unsub=weekRef().onSnapshot(s=>{S.week=s.exists?s.data():{}; if(S.tab==='mine'&&!isAdmin()) render()}, e=>toast(errText(e)));
}

async function loadMembers(silent){
  const tok=++S.loadTok, wk=S.weekStart;
  if(!silent){ S.membersLoading=true; render(); }
  try{
    const us=await db.collection(base()+'/members').get();
    const list=await Promise.all(us.docs.map(async d=>{
      const data=d.data(), status=data.status||'active';
      const tracked=data.role!=='admin' && status==='active';
      const w=tracked?await weekRef(d.id,wk).get():null;
      return {id:d.id,...data,status,week:(w&&w.exists)?w.data():{}};
    }));
    if(tok!==S.loadTok) return;
    list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
    S.members=list;
  }catch(e){toast(errText(e))}
  if(tok===S.loadTok){S.membersLoading=false; render()}
}

// kind: 'create' a new community (you become its leader) | 'join' an existing one (waits for approval)
async function signup(kind,f){
  const name=f.name.replace(/\s+/g,' ').trim();
  if(name.length<2) throw {message:'اكتب اسمك'};
  let cid, cname='';
  if(kind==='create'){
    cname=f.cname.replace(/\s+/g,' ').trim();
    if(cname.length<2) throw {message:'اكتب اسم المجموعة'};
    cid=genCode();
  }else{
    cid=normCode(f.code);
    if(cid.length<4) throw {message:'اكتب كود المجموعة'};
  }
  S.registering=true;
  let cred;
  try{
    cred=await auth.createUserWithEmailAndPassword(emailFor(cid,name),f.pw);
    try{
      await cred.user.updateProfile({displayName:cid+'|'+name});
      if(kind==='create'){
        const b=db.batch();
        b.set(db.doc('communities/'+cid),{name:cname,createdBy:cred.user.uid,createdAt:ts()});
        b.set(db.doc('communities/'+cid+'/members/'+cred.user.uid),{name,role:'admin',status:'active',createdAt:ts()});
        await b.commit();
      }else{
        const cs=await db.doc('communities/'+cid).get();
        if(!cs.exists) throw {message:'كود المجموعة غلط. اطلبه من المسؤول وجرّب تاني.'};
        await db.doc('communities/'+cid+'/members/'+cred.user.uid).set({name,role:'user',status:'pending',createdAt:ts()});
      }
    }catch(e){
      try{ await cred.user.delete() }catch(_){}
      throw e;
    }
  }catch(e){ S.registering=false; throw e }
  S.registering=false;
  LS.set('nb_code',cid);
  await afterLogin(cred.user);
}

auth && auth.onAuthStateChanged(async u=>{
  S.ready=true;
  if(S.registering) return;
  if(u && (!auth.currentUser || auth.currentUser.uid!==u.uid)) return; // stale event for an account that is already gone
  if(!u){ cleanup(); S.user=null; S.profile=null; render(); return }
  try{ await afterLogin(u) }catch(e){ S.authErr=errText(e); await auth.signOut() }
});

// ---------- views ----------
function render(){
  const app=$('#app');
  if(!configured){ app.innerHTML=setupView(); return }
  if(!S.ready){ app.innerHTML='<div class="center">جارٍ التحميل…</div>'; return }
  if(!S.user) app.innerHTML=authView();
  else if(S.orphan) app.innerHTML=orphanView();
  else if(!S.profile) app.innerHTML='<div class="center">جارٍ التحميل…</div>';
  else if(isPending()) app.innerHTML=pendingView();
  else app.innerHTML=shell();
}

function setupView(){
  return `<div class="auth"><div class="card"><h1>النوتة الروحية</h1>
  <p class="sub">${fbLoaded?'افتح ملف index.html والصق إعدادات Firebase في الأعلى (firebaseConfig) وبعدين ارفع الموقع.':'مش قادر يحمّل Firebase. اتأكد من الإنترنت وجرّب تاني. لو بتشوف الصفحة من داخل معاينة أو محرر، افتح الرابط الحقيقي من المتصفح.'}</p></div></div>`;
}

function authView(){
  const m=S.mode;
  const tabs=[['login','دخول'],['join','انضمام'],['create','مجموعة جديدة']];
  const hint = m==='join' ? 'اكتب كود المجموعة اللي المسؤول بعتهولك. المسؤول لازم يوافق على طلبك قبل ما تدخل.'
             : m==='create' ? 'هتبقى أنت المسؤول عن المجموعة، وهتاخد كود تبعته بس للناس اللي عايزهم. مجموعتك خاصة ومحدش من برّاها يشوفها.'
             : '';
  return `<div class="auth"><div class="card">
  <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M18 4h8v14h14v8H26v14h-8V26H4v-8h14z" fill="#c8a24a"/></svg>
  <h1>النوتة الروحية</h1>
  <p class="verse">«من يجاهد يضبط نفسه في كل شيء» (1كو 9: 25)</p>
  <div class="seg">${tabs.map(([k,l])=>`<button type="button" class="${m===k?'on':''}" data-act="mode" data-v="${k}">${l}</button>`).join('')}</div>
  <form id="authForm">
    ${m==='create'
      ?`<label>اسم المجموعة<input id="cn" required placeholder="مثلاً: أسرة مارجرجس" value="${esc(S.cnVal)}"></label>`
      :`<label>كود المجموعة<input id="jc" autocomplete="off" autocapitalize="none" required placeholder="الكود اللي المسؤول بعتهولك" value="${esc(S.codeVal)}"></label>`}
    <label>${m==='create'?'اسمك (المسؤول)':'الاسم'}<input id="nm" autocomplete="username" required placeholder="اكتب اسمك" value="${esc(S.nmVal)}"></label>
    <label>كلمة السر<input id="pw" type="password" autocomplete="${m==='login'?'current-password':'new-password'}" required minlength="6" placeholder="6 حروف أو أرقام على الأقل"></label>
    ${S.authErr?`<div class="err">${esc(S.authErr)}</div>`:''}
    <button class="btn primary" ${S.busy?'disabled':''}>${m==='login'?'دخول':m==='join'?'إرسال طلب الانضمام':'إنشاء المجموعة'}</button>
  </form>
  ${hint?`<p class="sub">${hint}</p>`:''}
  </div></div>`;
}

function pendingView(){
  return `<div class="auth"><div class="card">
  <h1>وصل طلبك ✓</h1>
  <p class="sub">أهلاً ${esc(S.profile.name)}. المسؤول عن ${esc(S.cname||'المجموعة')} لازم يوافق على انضمامك قبل ما تدخل النوتة. الصفحة هتتحدّث لوحدها أول ما يوافق، وتقدر تقفلها وترجع في أي وقت.</p>
  <button class="link" data-act="logout">خروج</button></div></div>`;
}

function orphanView(){
  return `<div class="auth"><div class="card">
  <h1>النوتة الروحية</h1>
  <p class="sub">حسابك مش موجود في ${esc(S.cname||'المجموعة')} دلوقتي (ممكن المسؤول يكون شالك أو رفض الطلب). لو عايز ترجع تقدر تبعت طلب انضمام جديد، والمسؤول هو اللي يقرر.</p>
  <button class="btn primary" data-act="rejoin">إرسال طلب انضمام</button>
  <button class="link" data-act="logout">خروج</button></div></div>`;
}

function inviteCard(){
  const link=location.origin+location.pathname+'?c='+S.cid;
  return `<div class="card invite"><div class="sub">كود مجموعتك${S.cname?' — '+esc(S.cname):''}</div>
  <div class="code">${esc(S.cid)}</div>
  <div class="sub" style="margin-bottom:8px">ابعت الكود أو الرابط بس للناس اللي عايزهم. أي حد يطلب الانضمام لازم توافق عليه.</div>
  <button class="mini" data-act="copy" data-v="${esc(link)}">نسخ رابط الدعوة</button>
  <button class="mini" data-act="copy" data-v="${esc(S.cid)}">نسخ الكود</button></div>`;
}

function shell(){
  const admin=isAdmin();
  const pend=S.members.filter(m=>m.status==='pending').length;
  const tabs=admin?[['dash','المتابعة'+(pend?' ('+pend+')':'')],['set','الإعدادات']]:[];
  const body = admin ? (S.tab==='set' ? setView() : dashView()) : mineView();
  return `<header class="top"><div><div class="t1">النوتة الروحية</div><div class="t2">${esc(S.profile.name)}${admin?' · مسؤول':''}${S.cname?' · '+esc(S.cname):''}</div></div><button class="ghost" data-act="logout">خروج</button></header>
  ${tabs.length?`<nav class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>`:''}
  <main>${body}</main>`;
}

function weekBar(){
  const end=addDays(S.weekStart,6), cur=wid(S.weekStart)===wid(startOfWeek(new Date()));
  return `<div class="weekbar"><button data-act="prev" aria-label="الأسبوع السابق">›</button>
  <div><b>${fmt(S.weekStart)} – ${fmt(end)}</b>${cur?'<small>الأسبوع الحالي</small>':''}</div>
  <button data-act="next" ${cur?'disabled':''} aria-label="الأسبوع التالي">‹</button></div>`;
}

function progressCard(p){
  return `<div class="card prog"><div class="pct">${p.pct}%</div><div style="flex:1"><div class="bar"><i style="width:${p.pct}%"></i></div><div class="sub">${p.done} من ${p.total}</div></div></div>`;
}

function tableView(week,edit){
  const it=S.items, d=(week&&week.d)||{}, w=(week&&week.w)||{};
  let h=`<div class="tbl"><table><thead><tr><th>اليوم</th>${it.daily.map(x=>`<th>${esc(x.label)}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<7;i++){
    h+=`<tr><th>${DAYS[i]}</th>${it.daily.map(x=>{
      const on=d[i]&&d[i][x.id];
      return `<td><button class="chk ${on?'on':''}" ${edit?`data-act="day" data-i="${i}" data-id="${esc(x.id)}"`:'disabled'} aria-label="${esc(x.label)}"></button></td>`;
    }).join('')}</tr>`;
  }
  h+='</tbody></table></div><h3>خانات الأسبوع</h3><div class="wk">';
  h+=it.weekly.map(x=>{
    const v=w[x.id];
    if(x.type==='number') return `<div class="wcard"><span>${esc(x.label)}</span>${edit?`<input type="number" min="0" inputmode="numeric" data-act="num" data-id="${esc(x.id)}" value="${v??''}">`:`<b>${v??0}</b>`}</div>`;
    return `<button class="wcard ${v?'on':''}" ${edit?`data-act="wk" data-id="${esc(x.id)}"`:'disabled'}><span>${esc(x.label)}</span><i class="chk ${v?'on':''}"></i></button>`;
  }).join('')+'</div>';
  return h;
}

function mineView(){
  return weekBar()+progressCard(calc(S.week))+(S.week===null?'<div class="muted">جارٍ التحميل…</div>':tableView(S.week,true));
}

function dashView(){
  if(S.selected){
    const m=S.members.find(x=>x.id===S.selected);
    if(m){
      return `<button class="back" data-act="back">‹ رجوع للقائمة</button>
      <h3 style="margin-top:0">${esc(m.name)}</h3>${weekBar()}${progressCard(calc(m.week))}${tableView(m.week,false)}
      <button class="btn danger" data-act="remove" data-id="${esc(m.id)}">حذف العضو من المجموعة</button>`;
    }
  }
  const pendingList=S.members.filter(m=>m.status==='pending');
  const activeList=S.members.filter(m=>m.status!=='pending'&&m.role!=='admin');
  const pendingHtml=pendingList.length
    ?`<h3 style="margin-top:6px">طلبات الانضمام (${pendingList.length})</h3>`+pendingList.map(m=>`<div class="row"><span class="nm" style="flex:1">${esc(m.name)}</span><button class="mini" data-act="approve" data-id="${esc(m.id)}">قبول</button><button class="mini red" data-act="remove" data-id="${esc(m.id)}">رفض</button></div>`).join('')
    :'';
  let body='';
  if(S.membersLoading) body='<div class="muted">جارٍ التحميل…</div>';
  else if(!activeList.length) body=inviteCard()+'<div class="muted">لسه مفيش أعضاء</div>';
  else{
    const rows=activeList.map(m=>({m,p:calc(m.week)}));
    const avg=Math.round(rows.reduce((a,r)=>a+r.p.pct,0)/rows.length);
    const idle=rows.filter(r=>r.p.done===0).length;
    body=`<div class="stats"><div class="stat"><b>${rows.length}</b><span>عدد الأعضاء</span></div><div class="stat"><b>${avg}%</b><span>متوسط الإنجاز</span></div><div class="stat"><b>${idle}</b><span>لم يبدأوا</span></div></div>`
      +rows.map(({m,p})=>`<button class="row" data-act="open" data-id="${esc(m.id)}"><span class="nm">${esc(m.name)}${m.role==='admin'?'<span class="chip">مسؤول</span>':''}</span><div class="bar"><i style="width:${p.pct}%"></i></div><span class="p">${p.pct}%</span></button>`).join('');
  }
  return pendingHtml+weekBar()+body+`<button class="mini" style="margin-top:8px" data-act="refresh">تحديث</button>`;
}

function setView(){
  if(!S.draft) S.draft=clone(S.items);
  const dr=S.draft;
  const list=(g)=>dr[g].map((x,i)=>`<div class="edit"><input value="${esc(x.label)}" data-act="lbl" data-g="${g}" data-i="${i}">${g==='weekly'?`<span class="sub">${x.type==='number'?'رقم':'علامة'}</span>`:''}<button class="mini red" data-act="del" data-g="${g}" data-i="${i}">حذف</button></div>`).join('');
  const members=S.members.filter(m=>m.status!=='pending').map(m=>`<div class="edit"><span style="flex:1">${esc(m.name)}${m.role==='admin'?'<span class="chip">مسؤول</span>':''}</span><button class="mini" data-act="role" data-id="${esc(m.id)}" ${m.id===S.user.uid?'disabled':''}>${m.role==='admin'?'إلغاء المسؤول':'اجعله مسؤول'}</button><button class="mini red" data-act="remove" data-id="${esc(m.id)}" ${m.role==='admin'?'disabled':''}>حذف</button></div>`).join('');
  return inviteCard()+`<h3 style="margin-top:6px">البنود اليومية</h3><div class="card">${list('daily')}
    <div class="edit"><input id="addD" placeholder="بند يومي جديد"><button class="mini" data-act="add" data-g="daily">إضافة</button></div></div>
    <h3>بنود الأسبوع</h3><div class="card">${list('weekly')}
    <div class="edit"><input id="addW" placeholder="بند أسبوعي جديد"><select id="addT"><option value="check">علامة</option><option value="number">رقم</option></select><button class="mini" data-act="add" data-g="weekly">إضافة</button></div></div>
    <button class="btn primary" data-act="saveItems">حفظ التعديلات</button>
    <p class="sub">حذف بند مش بيمسح البيانات القديمة، بس بيخفيه من الجدول.</p>
    <h3>الأعضاء والمسؤولين</h3><div class="card">${S.membersLoading?'<div class="muted">جارٍ التحميل…</div>':(members||'<div class="muted">مفيش أعضاء</div>')}
    <p class="sub">عشان تحذف مسؤول: دوس «إلغاء المسؤول» الأول وبعدين «حذف». الحذف بيمسح بيانات العضو كلها.</p></div>`;
}

// ---------- events ----------
function keepInputs(){
  for(const [id,k] of [['#nm','nmVal'],['#jc','codeVal'],['#cn','cnVal']]){ const el=$(id); if(el) S[k]=el.value }
}

document.addEventListener('submit', async e=>{
  if(e.target.id!=='authForm') return;
  e.preventDefault();
  const f={code:($('#jc')||{}).value||'', cname:($('#cn')||{}).value||'', name:$('#nm').value, pw:$('#pw').value};
  S.nmVal=f.name; S.codeVal=f.code; S.cnVal=f.cname; S.authErr=''; S.busy=true; render();
  try{
    if(S.mode==='login'){
      const cid=normCode(f.code);
      if(!cid) throw {message:'اكتب كود المجموعة'};
      await auth.signInWithEmailAndPassword(emailFor(cid,f.name),f.pw);
      LS.set('nb_code',cid);
    }else await signup(S.mode,f);
  }catch(err){ S.authErr=errText(err) }
  S.busy=false; render();
});

document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  const a=el.dataset.act, D=el.dataset;
  try{
    if(a==='mode'){keepInputs();S.mode=D.v;S.authErr='';render()}
    else if(a==='logout'){S.mode='login';S.authErr='';await auth.signOut()}
    else if(a==='tab'){
      S.tab=D.v; S.selected=null;
      if(S.tab==='set') S.draft=clone(S.items);
      if(isAdmin()&&(S.tab==='dash'||S.tab==='set')) loadMembers(); else render();
    }
    else if(a==='prev'||a==='next'){
      S.weekStart=addDays(S.weekStart,a==='prev'?-7:7);
      watchWeek();
      if(isAdmin()&&S.tab==='dash') loadMembers(); else render();
    }
    else if(a==='refresh'){loadMembers()}
    else if(a==='open'){S.selected=D.id;render()}
    else if(a==='back'){S.selected=null;render()}
    else if(a==='day'){
      const cur=!!(S.week&&S.week.d&&S.week.d[D.i]&&S.week.d[D.i][D.id]);
      await weekRef().set({d:{[D.i]:{[D.id]:!cur}},updatedAt:ts()},{merge:true});
    }
    else if(a==='wk'){
      const cur=!!(S.week&&S.week.w&&S.week.w[D.id]);
      await weekRef().set({w:{[D.id]:!cur},updatedAt:ts()},{merge:true});
    }
    else if(a==='add'){
      const g=D.g, inp=$(g==='daily'?'#addD':'#addW'), label=inp.value.trim();
      if(!label) return;
      const item={id:'x'+Date.now().toString(36),label};
      if(g==='weekly') item.type=$('#addT').value;
      S.draft[g].push(item); render();
    }
    else if(a==='del'){
      if(!confirm('تحذف البند ده؟')) return;
      S.draft[D.g].splice(+D.i,1); render();
    }
    else if(a==='saveItems'){
      if(!S.draft.daily.length){toast('لازم يفضل بند يومي واحد على الأقل');return}
      await itemsRef().set({daily:S.draft.daily,weekly:S.draft.weekly});
      S.items=clone(S.draft); toast('اتحفظ ✓'); render();
    }
    else if(a==='copy'){
      try{ await navigator.clipboard.writeText(D.v); toast('اتنسخ ✓') }
      catch(_){ prompt('انسخ من هنا:',D.v) }
    }
    else if(a==='approve'){
      const m=S.members.find(x=>x.id===D.id); if(!m) return;
      await mRef(m.id).update({status:'active'});
      m.status='active'; m.week={}; toast('اتقبل ✓'); render();
    }
    else if(a==='remove'){
      const m=S.members.find(x=>x.id===D.id); if(!m||m.id===S.user.uid||m.role==='admin') return;
      const pend=m.status==='pending';
      if(!confirm(pend?('ترفض طلب '+m.name+'؟'):('تشيل '+m.name+' من المجموعة؟ هيتمسح جدوله وكل بياناته، ومش هيقدر يرجع غير بموافقتك.'))) return;
      const ws=await db.collection(base()+'/members/'+m.id+'/weeks').get();
      for(let i=0;i<ws.docs.length;i+=400){
        const b=db.batch(); ws.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit();
      }
      await mRef(m.id).delete();
      S.members=S.members.filter(x=>x.id!==m.id); S.selected=null;
      toast(pend?'اترفض ✓':'اتشال ✓'); render();
    }
    else if(a==='rejoin'){
      const dn=String(S.user.displayName||'');
      await mRef().set({name:dn.slice(dn.indexOf('|')+1)||'عضو',role:'user',status:'pending',createdAt:ts()});
    }
    else if(a==='role'){
      const m=S.members.find(x=>x.id===D.id); if(!m) return;
      const role=m.role==='admin'?'user':'admin';
      if(!confirm(role==='admin'?'تخليه مسؤول؟ هيشوف تقدم كل الأعضاء.':'تلغي إنه مسؤول؟')) return;
      await mRef(m.id).update({role});
      m.role=role; render();
    }
  }catch(err){toast(errText(err))}
});

document.addEventListener('change', async e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const a=el.dataset.act;
  try{
    if(a==='num'){
      const v=Math.max(0,parseInt(el.value,10)||0);
      await weekRef().set({w:{[el.dataset.id]:v},updatedAt:ts()},{merge:true});
    }else if(a==='lbl'){
      const v=el.value.trim();
      if(v) S.draft[el.dataset.g][+el.dataset.i].label=v; else el.value=S.draft[el.dataset.g][+el.dataset.i].label;
    }
  }catch(err){toast(errText(err))}
});

render();
</script>
</body>
</html>
